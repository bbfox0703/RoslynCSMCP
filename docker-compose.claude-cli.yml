# =============================================================================
# Useful Commands
# =============================================================================
#
# Build the image:
#   docker-compose -f docker-compose.claude-cli.yml build
#
# Start the container:
#   docker-compose -f docker-compose.claude-cli.yml up -d
#
# Stop the container:
#   docker-compose -f docker-compose.claude-cli.yml down
#
# View logs:
#   docker-compose -f docker-compose.claude-cli.yml logs -f
#
# View logs (last 100 lines):
#   docker-compose -f docker-compose.claude-cli.yml logs --tail=100
#
# Execute command in running container:
#   docker-compose -f docker-compose.claude-cli.yml exec roslynmcp sh
#
# Test the server directly:
#   echo '{"method":"tools/list"}' | docker exec -i roslynmcp-cli dotnet RoslynMcpServer.dll
#
# Rebuild and restart:
#   docker-compose -f docker-compose.claude-cli.yml up -d --build
#
# Remove container and volumes:
#   docker-compose -f docker-compose.claude-cli.yml down -v
#
# =============================================================================

# =============================================================================
# Troubleshooting
# =============================================================================
#
# Container won't start:
#   - Check logs: docker-compose -f docker-compose.claude-cli.yml logs
#   - Verify Docker is running: docker info
#   - Check volume paths exist on host
#
# Claude CLI can't connect:
#   - Verify container is running: docker ps | grep roslynmcp-cli
#   - Test connection: docker exec -i roslynmcp-cli dotnet --info
#   - Check Claude CLI config syntax
#
# Performance issues:
#   - Increase resource limits in deploy.resources section
#   - Check host disk I/O for volume mounts
#   - Consider using bind mounts instead of volumes on Windows
#
# Log file issues:
#   - Verify log directory permissions: ls -la /path/to/logs
#   - Check LOGS_PATH is correctly mounted
#   - Ensure read-write permissions: :rw flag on volume mount
#
# =============================================================================
